<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>KamusERP — Mockups</title>
<style>
/* ===== Tokens (mesmo conceito que será usado no frontend real) ===== */
:root{
  --bg:#F6F6F8; --surface:#FFFFFF; --surface-2:#F2F2F5; --border:#E5E5EA; --text:#16161D; --muted:#6B6B78;
  --primary:#4F46E5; --primary-fg:#FFFFFF; --primary-soft:#EEEFFE;
  --success:#15803D; --success-soft:#E7F6EC; --danger:#DC2626; --danger-soft:#FDECEC;
  --warning:#B45309; --warning-soft:#FEF3DD; --info:#2563EB; --info-soft:#E6EEFE;
  --shadow:0 1px 2px rgba(16,16,29,.05),0 1px 3px rgba(16,16,29,.05);
  --shadow-lg:0 12px 32px rgba(16,16,29,.14),0 2px 6px rgba(16,16,29,.06);
  --overlay:rgba(18,18,30,.32);
}
[data-theme=dark]{
  --bg:#0C0C11; --surface:#15151C; --surface-2:#1D1D26; --border:#2A2A36; --text:#F2F2F6; --muted:#9A9AA8;
  --primary:#8B85FF; --primary-fg:#0C0C11; --primary-soft:#23213F;
  --success:#4ADE80; --success-soft:#11291B; --danger:#F87171; --danger-soft:#351616;
  --warning:#FBBF24; --warning-soft:#33270C; --info:#60A5FA; --info-soft:#0F2240;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 40px rgba(0,0,0,.55);
  --overlay:rgba(0,0,0,.55);
}
[data-accent=admin]{ --primary:#D97706; --primary-soft:#FEF3DD; }
[data-theme=dark][data-accent=admin]{ --primary:#F59E0B; --primary-fg:#111; --primary-soft:#33270C; }

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#888;-webkit-font-smoothing:antialiased}
.screen{width:1440px;height:900px;position:relative;overflow:hidden;background:var(--bg);color:var(--text);font-size:14px;margin-bottom:40px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)} .small{font-size:12px} .xs{font-size:11px}
.row{display:flex;align-items:center} .gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.grow{flex:1} .num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:500;font-size:13px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.ghost{background:transparent;border-color:transparent}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.b-success{background:var(--success-soft);color:var(--success)} .b-danger{background:var(--danger-soft);color:var(--danger)}
.b-warning{background:var(--warning-soft);color:var(--warning)} .b-info{background:var(--info-soft);color:var(--info)}
.b-neutral{background:var(--surface-2);color:var(--muted)} .b-primary{background:var(--primary-soft);color:var(--primary)}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted);background:var(--surface)}

/* ===== Shell ===== */
.shell{display:grid;grid-template-columns:248px 1fr;height:100%}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:700;font-size:17px;letter-spacing:-.02em}
.logo .mark{width:30px;height:30px;border-radius:9px;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;font-weight:800;font-size:15px}
.nav-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:9px;color:var(--muted);font-weight:500;text-decoration:none}
.nav a.active{background:var(--primary-soft);color:var(--primary)}
.nav a .chev{margin-left:auto;width:15px;height:15px}
.nav .sub{padding-left:38px} .nav .sub a{height:30px;font-size:13px;padding-left:10px}
.nav .sub a.active{background:transparent;color:var(--text);font-weight:600;position:relative}
.nav .sub a.active:before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--primary)}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:12px}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:64px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;padding:0 24px;gap:12px}
.search{width:440px;height:38px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;color:var(--muted)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);display:grid;place-items:center;color:var(--muted);position:relative;background:var(--surface)}
.iconbtn.on{border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface)}
.company{display:flex;align-items:center;gap:10px;height:38px;border:1px solid var(--border);border-radius:10px;padding:0 10px;background:var(--surface)}
.company.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.company .t{line-height:1.15}.company .t b{font-size:13px;font-weight:600;display:block}.company .t span{font-size:11px;color:var(--muted)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#F472B6,#8B5CF6);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px}
.content{padding:20px 28px;overflow:hidden;flex:1;position:relative}
.crumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.crumb svg.i{width:13px;height:13px}
h1{font-size:23px;font-weight:700;letter-spacing:-.02em}
h2{font-size:15px;font-weight:600}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg span{padding:5px 12px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg span.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi .lbl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.kpi .val{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:8px 0 4px}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600}
.delta svg.i{width:14px;height:14px}
.up{color:var(--success)} .down{color:var(--danger)}
.grid-2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0}
.card-b{padding:12px 18px 16px}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;text-transform:uppercase;letter-spacing:.04em}
td{padding:8px 10px;border-top:1px solid var(--border);font-size:13px}
td.r,th.r{text-align:right}
.thumb{width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.alert-item{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--border)}
.alert-item:first-child{border-top:0}
.alert-item .ai{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.alert-item b{font-weight:600;font-size:13px;display:block}
.alert-item span{font-size:12px;color:var(--muted)}

/* Overlays */
.overlay{position:absolute;inset:0;background:var(--overlay);backdrop-filter:blur(2px)}
.pop{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden}
.pop-sec{padding:6px}
.pop-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:10px 12px 6px}
.pop-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px}
.pop-item.sel{background:var(--primary-soft)}
.pop-item .pi{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}
.hr{height:1px;background:var(--border)}
mark{background:var(--warning-soft);color:inherit;border-radius:3px;padding:0 1px}

/* Grade */
.matrix th,.matrix td{text-align:center}
.matrix td{font-size:14px;font-weight:600;padding:0;height:46px}
.matrix td .c{margin:4px;height:38px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2)}
.matrix td .c.zero{background:var(--danger-soft);color:var(--danger)}
.matrix td .c.low{background:var(--warning-soft);color:var(--warning)}
.matrix td.tot .c{background:transparent;color:var(--muted)}
.swatch{width:16px;height:16px;border-radius:50%;border:1px solid var(--border);flex:none}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--border);margin-bottom:18px}
.tabs span{padding:10px 0;font-weight:500;color:var(--muted);font-size:13.5px}
.tabs span.on{color:var(--text);box-shadow:inset 0 -2px 0 var(--primary)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:7px;background:var(--surface-2);font-size:12px;color:var(--muted);font-weight:500}
.input{height:38px;border:1px solid var(--border);border-radius:10px;background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 12px;color:var(--text)}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.banner{display:flex;align-items:center;gap:12px;padding:10px 28px;background:var(--warning-soft);color:var(--warning);border-bottom:1px solid var(--border);font-size:13px}
.banner b{font-weight:600}

/* Mobile */
.phone{width:360px;height:760px;border-radius:52px;background:#0A0A0A;padding:11px;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.phone .scr{width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--bg);color:var(--text);position:relative;display:flex;flex-direction:column;font-size:13px}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:#0A0A0A;z-index:5}
.status{height:46px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font-size:13px;font-weight:600}
.m-tab{height:72px;border-top:1px solid var(--border);background:var(--surface);display:flex;justify-content:space-around;align-items:flex-start;padding-top:10px}
.m-tab div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);font-weight:500}
.m-tab div.on{color:var(--primary)}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ===== Ícones (traço estilo Lucide) ===== */

 menu:'<path d="M4 6h16M4 12h16M4 18h16"/>', bank:'<path d="M3 22h18M6 18v-7M10 18v-7M14 18v-7M18 18v-7M12 2l8 5H4z"/>',

const I=(n,s)=>`<svg class="i" viewBox="0 0 24 24" ${s?`style="width:${s}px;height:${s}px"`:''}>${P[n]}</svg>`;

/* ===== Shell ===== */
function sidebar(active, sub){
  const items=[
    ['dash','Dashboard'],
    ['shirt','Cadastros',['Produtos','Grades e cores','Clientes','Fornecedores']],
    ['box','Estoque',['Posição de estoque','Entrada de mercadoria','Ajustes','Transferências','Inventário']],
    ['wallet','Financeiro',['Contas a pagar','Contas a receber','Fluxo de caixa','Contas financeiras']],
    ['bag','Vendas'],
    ['file','Relatórios'],
  ];
  let h=`<aside class="sidebar"><div class="logo"><div class="mark">K</div>kamus<span class="badge b-neutral" style="margin-left:auto;height:20px">ERP</span></div>
  <div class="nav"><div class="nav-label">Menu</div>`;
  for(const [ic,label,subs] of items){
    const on=label===active;
    h+=`<a class="${on?'active':''}">${I(ic)}${label}${subs?`<svg class="i chev" viewBox="0 0 24 24">${on?P.cd:P.cr}</svg>`:''}</a>`;
    if(on&&subs) h+=`<div class="sub">${subs.map(s=>`<a class="${s===sub?'active':''}">${s}</a>`).join('')}</div>`;
  }
  h+=`<div class="nav-label">Sistema</div><a>${I('sliders')}Configurações</a></div>
  <div class="side-foot nav"><a>${I('cl2')}Recolher menu</a></div></aside>`;
  return h;
}
function topbar(o={}){
  return `<header class="topbar">
    <div class="search">${I('search',17)}<span class="grow">Pesquisar produtos, SKU, clientes, telas...</span><kbd>Ctrl</kbd><kbd>K</kbd></div>
    <div class="grow"></div>
    <div class="company ${o.companyOn?'on':''}"><div class="thumb" style="width:26px;height:26px;background:var(--primary-soft);color:var(--primary)">${I('building',15)}</div>
      <div class="t"><b>Kamus Moda Centro</b><span>12.345.678/0001-90</span></div>${I('cd',16)}</div>
    <div class="iconbtn ${o.bellOn?'on':''}">${I('bell')}<span class="dot">3</span></div>
    <div class="iconbtn">${I(o.dark?'sun':'moon')}</div>
    <div class="row gap8" style="margin-left:4px"><div class="avatar">AD</div><div style="line-height:1.2"><div style="font-weight:600;font-size:13px">Admin Demo</div><div class="xs muted">Dono</div></div></div>
  </header>`;
}
function screen(id,theme,inner,attrs=''){return `<section class="screen" id="${id}" data-theme="${theme}" ${attrs}>${inner}</section>`}
function app(id,theme,{active,sub,content,overlay='',banner='',top={}}){
  return screen(id,theme,`<div class="shell">${sidebar(active,sub)}<div class="main">${topbar({...top,dark:theme==='dark'})}${banner}<div class="content">${content}</div></div></div>${overlay}`);
}

/* ===== Gráfico ===== */
let gid=0;
function areaChart(w,h,data,{grid=true,labels=true}={}){
  const id='ga'+(++gid);
  const max=Math.max(...data)*1.15, pad=labels?28:4, ph=h-(labels?22:4);
  const x=i=>pad+i*(w-pad-4)/(data.length-1), y=v=>ph-(v/max)*(ph-8);
  const line=data.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area=`${line} L${x(data.length-1)},${ph} L${x(0)},${ph} Z`;
  let g='';
  if(grid) for(let k=0;k<=3;k++){const yy=8+k*(ph-8)/3; g+=`<line x1="${pad}" x2="${w}" y1="${yy}" y2="${yy}" stroke="var(--border)" stroke-dasharray="3 4"/>`;
    if(labels) g+=`<text x="0" y="${yy+4}" font-size="10.5" fill="var(--muted)">${Math.round(max*(1-k/3)/100)/10}k</text>`;}
  let lb=''; if(labels){ ['14/09','21/09','28/09','05/10','12/10'].forEach((t,k)=>{lb+=`<text x="${Math.min(x(Math.round(k*(data.length-1)/4))-14,w-34)}" y="${h-4}" font-size="10.5" fill="var(--muted)">${t}</text>`});}
  const li=data.length-1;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--primary)" stop-opacity=".28"/><stop offset="1" stop-color="var(--primary)" stop-opacity="0"/></linearGradient></defs>
  ${g}<path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="var(--primary)" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="${x(li)}" cy="${y(data[li])}" r="4.5" fill="var(--surface)" stroke="var(--primary)" stroke-width="2.4"/>${lb}</svg>`;
}
