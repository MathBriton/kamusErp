name: pr-title

# O título do PR vira a mensagem do commit no "squash merge" e alimenta o CHANGELOG,
# então precisa seguir Conventional Commits (feat:, fix:, docs:, ...).
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            build
            ci
            test
            chore
            style
          requireScope: false
