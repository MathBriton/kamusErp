name: release

# Botão "Run workflow" na aba Actions (só na main). Calcula a versão pelos Conventional Commits
# desde a última tag, cria a tag vX.Y.Z + GitHub Release com notas e publica as imagens no GHCR.
# Não abre PR nem faz commit: só precisa de permissão de escrita no conteúdo, pedida abaixo.
on:
  workflow_dispatch:
    inputs:
      incremento:
        description: "Incremento da versão (automático = pelos commits)"
        type: choice
        options: [automatico, patch, minor, major]
        default: automatico

permissions:
  contents: write # criar tag e Release
  checks: read    # conferir se o CI do commit está verde

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preparar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      lancar: ${{ steps.versao.outputs.lancar }}
      versao: ${{ steps.versao.outputs.versao }}
      tag: ${{ steps.versao.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # histórico e tags completos para calcular a versão

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Testes do script de versão
        run: node --test .github/scripts/release/*.test.mjs

      - name: CI verde neste commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Jobs "build-test" do backend-ci e do web-ci (os que rodaram para este commit)
          checks=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "build-test")]')
          echo "$checks" | jq -r '.[] | "\(.name): \(.status) / \(.conclusion)"'
          pendentes=$(echo "$checks" | jq '[.[] | select(.status != "completed")] | length')
          falhas=$(echo "$checks" | jq '[.[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped")] | length')
          if [ "$pendentes" -gt 0 ]; then echo "::error::CI ainda rodando neste commit. Aguarde e tente de novo."; exit 1; fi
          if [ "$falhas" -gt 0 ]; then echo "::error::CI falhou neste commit. Corrija antes de lançar."; exit 1; fi

      - name: Calcular versão e notas
        id: versao
        env:
          INCREMENTO: ${{ inputs.incremento }}
        run: node .github/scripts/release/cli.mjs

      - name: Criar tag e GitHub Release
        if: steps.versao.outputs.lancar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versao.outputs.tag }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md
          echo "### Release $TAG criada" >> "$GITHUB_STEP_SUMMARY"
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Nada a lançar
        if: steps.versao.outputs.lancar != 'true'
        run: echo "Sem commits feat/fix/perf desde a última release. Use um incremento forçado para lançar mesmo assim." >> "$GITHUB_STEP_SUMMARY"

  docker:
    needs: preparar
    if: needs.preparar.outputs.lancar == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kamus-api
            context: .
            dockerfile: src/backend/Kamus.Api/Dockerfile
          - image: kamus-web
            context: src/web
            dockerfile: src/web/Dockerfile
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preparar.outputs.tag }}

      - name: Nome da imagem (minúsculas)
        id: nome
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.nome.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.preparar.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.preparar.outputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.preparar.outputs.versao }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
