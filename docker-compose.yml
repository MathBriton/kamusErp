name: kamus

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kamus}
      POSTGRES_USER: ${POSTGRES_USER:-kamus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kamus_dev}
      KAMUS_APP_PASSWORD: ${KAMUS_APP_PASSWORD:-kamus_app_dev}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/backend/Kamus.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Kamus: Host=db;Port=5432;Database=${POSTGRES_DB:-kamus};Username=kamus_app;Password=${KAMUS_APP_PASSWORD:-kamus_app_dev}
      # Migrations rodam com o dono do banco; a aplicação usa o kamus_app (sujeito ao RLS)
      ConnectionStrings__KamusMigrations: Host=db;Port=5432;Database=${POSTGRES_DB:-kamus};Username=${POSTGRES_USER:-kamus};Password=${POSTGRES_PASSWORD:-kamus_dev}
      Seed__SenhaAdmin: ${SEED_ADMIN_PASSWORD:-Kamus@Dev123}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: src/web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db-data:
